<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grok's Destructive 3D Physics Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0f; font-family: system-ui, -apple-system, sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 14px;
      left: 14px;
      color: #e0e0ff;
      background: rgba(8, 8, 18, 0.82);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(100, 130, 255, 0.3);
      backdrop-filter: blur(10px);
      pointer-events: none;
      user-select: none;
      line-height: 1.5;
      font-size: 13.5px;
      min-width: 210px;
    }
    #ui strong { color: #8af; }
    #ui .mode { color: #ff9; font-weight: 600; }
    #ui .on { color: #4f8; }
    #ui .off { color: #f66; }
    #hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(190, 205, 255, 0.75);
      font-size: 12.5px;
      pointer-events: none;
      text-align: center;
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      border-radius: 8px;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.85);
    }
    #crosshair::before {
      width: 2px; height: 18px; left: 8px; top: 0;
    }
    #crosshair::after {
      width: 18px; height: 2px; left: 0; top: 8px;
    }
    #blocker {
      position: absolute;
      inset: 0;
      background: rgba(5,5,15,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      color: #eee;
      font-size: 18px;
      z-index: 10;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div><strong>Bodies:</strong> <span id="count">0</span></div>
    <div>Mode: <span id="mode" class="mode">ORBIT</span></div>
    <div>Rapid Fire: <span id="rapid" class="off">OFF</span></div>
    <div style="margin-top:10px;font-size:12px;opacity:0.85;line-height:1.55">
      <div><strong>V</strong> — Toggle First Person</div>
      <div><strong>R</strong> — Toggle Rapid Fire</div>
      <div><strong>1-4</strong> — Change ammo</div>
      <div><strong>C</strong> — Clear all dynamic</div>
      <div><strong>N</strong> — Nuke (big heavy ball)</div>
      <div style="margin-top:6px">WASD / Arrows + Space / Shift</div>
    </div>
  </div>
  <div id="hint">Click to lock mouse in FPS · Left click = shoot · Hold in rapid fire</div>
  <div id="crosshair"></div>
  <div id="blocker">CLICK TO ENTER FIRST PERSON</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
